# 0xfe Nginx Security Configuration
# Place in /etc/nginx/sites-available/0xfe

limit_req_zone $binary_remote_addr zone=paste_general:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=paste_uploads:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=paste_conn:10m;

server {
    listen 80;
    server_name anlica.icu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name anlica.icu;

    # SSL Configuration (Modern)
    ssl_certificate /etc/letsencrypt/live/anlica.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anlica.icu/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_prefer_server_ciphers on;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;

    # Optimization
    client_max_body_size 512M;
    keepalive_timeout 60s;

    # WAF: Block Hidden Files & Common Exploits
    location ~ /\.(?!well-known) { deny all; }
    if ($request_uri ~* "(php|env|git|svn|htaccess)") { return 444; }

    # Main App
    location / {
        limit_req zone=paste_general burst=20 nodelay;
        limit_conn paste_conn 20;
        
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stricter Limits for Uploads
    location = / {
        limit_req zone=paste_uploads burst=2 nodelay;
        limit_conn paste_conn 5;
        
        client_body_buffer_size 128k;
        
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
