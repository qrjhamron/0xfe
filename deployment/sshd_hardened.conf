# SSH Server Hardening Configuration
# Deploy this to /etc/ssh/sshd_config.d/99-hardened.conf
# Reload with: systemctl reload ssh

# Use non-standard port to reduce scan visibility
# Port 22

# Only accept SSH protocol version 2
Protocol 2

# Hide OpenSSH version banner by disabling Debian banner
DebianBanner no

# Use custom banner file with generic signature
Banner /etc/ssh/banner

# Host keys: Use strong algorithms only
HostKey /etc/ssh/ssh_host_ed25519_key

# Key exchange: Strong algorithms only, no weak ones
KexAlgorithms curve25519-sha256@libssh.org,curve25519-sha256

# Ciphers: ChaCha20-Poly1305 and modern AES-GCM only
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com

# MAC: Authenticated encryption algorithms
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# No compression (reduces fingerprinting surface and prevents CRIME-like attacks)
Compression no

# Authentication
PermitRootLogin no
PasswordAuthentication no
PubkeyAuthentication yes
ChallengeResponseAuthentication no
UsePAM yes

# X11 and agent
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no

# Logging
SyslogFacility AUTH
LogLevel VERBOSE

# Timing and limits
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive yes
MaxAuthTries 3
MaxSessions 10

# Privilege separation
UsePrivilegeSeparation sandbox

# Additional hardening
StrictModes yes
IgnoreRhosts yes
HostbasedAuthentication no
RhostsRSAAuthentication no
RSAAuthentication no
