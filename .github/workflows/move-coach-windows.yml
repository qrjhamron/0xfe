name: Build Move Coach Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Move Coach build branch
        uses: actions/checkout@v4
        with:
          ref: codex/move-coach-v12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes
      - name: Build installer
        shell: powershell
        run: .\windows\build_windows.ps1 -Clean
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoveCoach-Windows-v13
          path: windows/Output/MoveCoach-Setup-v13.exe
      - name: Publish installer release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: move-coach-v13-${{ github.run_id }}
          name: Move Coach Windows V13 (${{ github.run_id }})
          target_commitish: codex/move-coach-v12
          generate_release_notes: false
          files: windows/Output/MoveCoach-Setup-v13.exe
