name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'move-coach-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes
      - name: Build installer
        shell: powershell
        run: .\windows\build_windows.ps1 -Clean
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MoveCoach-Windows-v17
          path: windows/Output/MoveCoach-Setup-v17.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/move-coach-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Move Coach ${{ github.ref_name }}
          files: windows/Output/MoveCoach-Setup-v17.exe
