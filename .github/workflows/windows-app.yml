name: Windows app (PySide6)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/pyside6-app
    tags:
      - 'move-coach-app-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build app and run smoke test
        shell: powershell
        run: .\windows\build_app.ps1
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoveCoachApp-Windows
          path: dist/MoveCoachApp
          if-no-files-found: error
      - name: Zip app for release
        if: startsWith(github.ref, 'refs/tags/move-coach-app-v')
        shell: powershell
        run: Compress-Archive -Path dist/MoveCoachApp -DestinationPath MoveCoachApp-Windows.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/move-coach-app-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Move Coach App ${{ github.ref_name }}
          files: MoveCoachApp-Windows.zip
