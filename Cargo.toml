[package]
name = "pastebin_cli"
version = "0.1.0"
edition = "2024"

[lib]
name = "pastebin_cli"
path = "src/lib.rs"

[[bin]]
name = "pastebin_cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
arc-swap = "1.8.0"
axum = { version = "0.8.1", features = ["multipart", "http2"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
bcrypt = "0.17.1"
bytes = "1.11.0"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
dashmap = "6.1.0"
fs2 = "0.4.3"
futures = "0.3.31"
governor = "0.10.4"
hex = "0.4.3"
html-escape = "0.2.13"
infer = "0.19.0"
lazy_static = "1.5.0"
lru = "0.12.3"
memmap2 = "0.9.4"
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"
mime_guess = "2.0.5"
multer = "3.1.0"
opentelemetry = "0.31.0"
opentelemetry-otlp = "0.31.0"
opentelemetry-semantic-conventions = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
rand = "0.9.2"
regex = "1.10.4"
rustls = { version = "0.23.36", features = ["ring"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.8"
sqlx = { version = "0.8.6", features = ["chrono", "runtime-tokio-rustls", "sqlite", "migrate"] }
sysinfo = "0.37.2"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.10", features = ["io"] }
toml = "0.9.11"
tower = "0.5.2"
tower-http = { version = "0.6.8", features = ["trace", "fs", "limit", "request-id", "util", "cors"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-opentelemetry = "0.32.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
uuid = { version = "1.19.0", features = ["v4"] }
zip = { version = "2.1.0", default-features = false, features = ["deflate"] }
