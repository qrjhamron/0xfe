groups:
  - name: pastebin_alerts
    rules:
      - alert: HighRequestRate
        expr: rate(http_requests_total[1m]) > 100
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High request rate detected"
          description: "Request rate is above 100 req/s for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[1m]) / rate(http_requests_total[1m]) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for more than 1 minute."

      - alert: AuthFailureStorm
        expr: rate(auth_failures_total[1m]) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Authentication failure storm detected"
          description: "More than 10 auth failures per second."

      - alert: HighMemoryUsage
        expr: system_memory_usage_bytes > 1000000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 1GB."
