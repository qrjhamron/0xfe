plugins {
    id 'com.android.application'
}

android {
    namespace 'com.movecoach.android'
    compileSdk 34

    defaultConfig {
        applicationId 'com.movecoach.android'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The Patricia engine ships as an executable packaged like a native
    // library; it must be extracted so the app can exec it.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
